# Cards for PolicyEngine's posts on the UK Autumn Budget 2026 (28 October 2026).
# make_cards.py draws exactly this text and nothing else. Edit it here, then
# render (see cards/README.md): on GitHub, committing this file renders the
# cards for you.
#
# Each card has a line above the headline (`kicker`), a serif `headline`, two
# or three `stats` (a large `value`, a short `label`, an optional small `tag`
# above the value), an optional `note` in small type, and a `footer` (the
# link). `post` and `gate` say where the card goes and what it waits on; they
# are printed, not drawn. Each stat names where its figure comes from
# (`source`), so a reviewer can trace it: change a figure only with its source.

[campaign]
name = "UK Autumn Budget 2026"
funder = "nuffield"  # "Funded by" and the Nuffield Foundation logo, small, top right

# A LinkedIn document post: these square cards, one per page, as one PDF.
[[document]]
id = "p1-linkedin-document"
title = "Four explainers on the UK Autumn Budget 2026"
cards = ["p1-households", "p1-energy", "p1-pta", "p1-fuel", "p1-triple-lock"]

[[document]]
id = "p1-p6-linkedin-document"
title = "Five explainers on the UK Autumn Budget 2026"
cards = ["p1-households", "p1-energy", "p1-pta", "p1-fuel", "p1-triple-lock", "p6-carers"]

[[card]]
id = "p1-households"
post = "P1, lead post"
gate = "none: the four explainers are live"
kicker = "UK Autumn Budget 2026 · Household examples"
headline = "What the Budget means for example households"
note = "PolicyEngine UK household calculations. Fuel assumes retailers pass on the cut in full and a pre-Budget duty rate of 60.59p a litre from April 2027."
footer = "policyengine.org/uk/research"

  [[card.stats]]
  tag = "Energy bills"
  value = "£135"
  label = "over 2026-27 and 2027-28 for a band A to D home in England using 2,500 kWh a year"
  source = "budget-2026-energy-bills, Table 2"

  [[card.stats]]
  tag = "Pension Tax Allowance"
