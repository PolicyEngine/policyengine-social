[project]
name = "policyengine-social-cards"
version = "0.1.0"
description = "Share cards for PolicyEngine social posts, drawn from a text file per campaign"
requires-python = ">=3.11"
dependencies = ["pillow==12.3.0", "numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
