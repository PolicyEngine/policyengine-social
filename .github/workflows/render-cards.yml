name: Render cards

# Edit a campaign's cards.toml (on GitHub or locally) and push. This tests the
# renderer, draws every card, and commits the PNGs and PDFs back to the same
# branch. It never posts anything: posting only happens from posts/queue/.
on:
  push:
    branches: ["**"]
    paths:
      - "cards/**"
      - ".github/workflows/render-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cards
    steps:
      - uses: actions/checkout@v7

      - name: Install librsvg (funder logos) and FriBiDi (kerning)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin libfribidi0

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Test the renderer
        run: uv run --locked --group dev pytest -q

      - name: Render every campaign
        run: uv run --locked make_cards.py

      - name: Keep the rendered cards as a download
        uses: actions/upload-artifact@v7
        with:
          name: cards
          path: cards/campaigns/*/rendered/

      - name: Commit the rendered cards to this branch
        env:
          CARD_BRANCH: ${{ github.ref_name }}
        run: |
          rendered_sha=$(git rev-parse HEAD)
          git fetch --no-tags origin "refs/heads/$CARD_BRANCH"
          head_sha=$(git rev-parse FETCH_HEAD)
          if [ "$head_sha" != "$rendered_sha" ]; then
            if ! git merge-base --is-ancestor "$rendered_sha" "$head_sha"; then
              echo "::error::The branch was rewritten while these cards rendered. Run Render cards again on the branch (Actions, Render cards, Run workflow)."
              exit 1
            fi
            # Every render input matches the push paths above, so a push that
            # changes one starts its own run, which draws the newer text.
            if ! git diff --quiet "$rendered_sha" "$head_sha" -- . ':(exclude)campaigns/*/rendered/*' ../.github/workflows/render-cards.yml; then
              echo "The branch moved and its card inputs changed while these cards rendered; the newer run will render them."
              exit 0
            fi
            # Only files the cards don't read changed (a README, say), and a push
            # of those starts no run: these images still match, so commit them
            # on top of the newer commit.
            echo "The branch moved, but not its card inputs; committing these cards on top of it."
            saved=$(mktemp -d)
            cp -a campaigns "$saved/"
            git checkout --quiet --force "$head_sha"
            rm -rf campaigns/*/rendered
            for dir in "$saved"/campaigns/*/rendered; do
              cp -a "$dir" "campaigns/$(basename "$(dirname "$dir")")/"
            done
          fi
          git add --all -- campaigns/*/rendered
          if git diff --cached --quiet; then
            echo "The rendered cards are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render cards"
          # A rejected push means the branch changed after the fetch. Leave the
          # newer run to render that source; never rebase or retry these images.
          git push origin "HEAD:refs/heads/$CARD_BRANCH"
